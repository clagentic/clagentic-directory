# Repo profile: the shape this repository must keep. See clagentic-loadout docs/repo-profile.md.
# This repository ships as a released tool (public GitHub repo, Go daemon, client and schemas).
class: released-tool
# Risk posture, read by gates from the merge base. Derived from repo facts: the repository is
# public, and merges go through the merge gate with required_reviewer_roles [reviewer, security].
# posture exposure/data: roci ruling 2026-11-02 (lr-d3a0e3), following clagentic-loadout lr-0ada16 R8
# (posture from repo facts).
visibility: public
merge_control: review_required
exposure: internet
data: public_or_none
confirmed_at: 2026-11-02
paths:
  # Holds the roles, the merge_requirements, and the one generic post-merge step
  # (`clagentic-directory update`, no arguments, no host value).
  ".clagentic/loadout/config.yaml": {class: internal}
  # Crew enrollment config for this deployment.
  ".crew/**": {class: internal}
# Go has no JUnit output of its own, so both commands go through
# scripts/go_test_junit.py, which asks the Makefile (test-json) to run go test and
# converts the result. Exit code of each: 0 all passed (or `files` selected no Go
# package); 2 go test failed, by a failing test or a build failure, both written to
# the JUnit report as failing cases (make's code for a failed recipe); 1 make
# succeeded but the event stream holds a failing case; 64 usage error, or a path
# that cannot be passed to go test safely (no report written); any other code is
# make's own (for example 127 when make is not installed). `files`
# receives repo-relative paths, maps each .go file to its package directory,
# deduplicates, and skips every non-Go file. See CONTRIBUTING.md.
test:
  full: [python3, scripts/go_test_junit.py, --junit, "{junit}", full]
  files: [python3, scripts/go_test_junit.py, --junit, "{junit}", files]
