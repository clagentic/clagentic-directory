# Repo-tier loadout config (merge-gate keys are in gate.yaml; see clagentic-loadout docs/provisioning.md,
# "Merge-gate config homes" section). Kept minimal: this repo has no CI runner
# wired up yet, so the merge gate must not block on a CI signal that will
# never arrive.
#
# lr-d3969e: this repo declares its own `roles:` section (below) because
# `security` is NOT a member of clagentic_loadout.provisioning.roles's
# DEFAULT_ROLE_VERBS (that reference mapping covers only builder/reviewer/
# merger/lead — see roles.py:92-97). A repo's own `roles:` section REPLACES
# the default mapping entirely, it does not merge with it (roles.py:34-39),
# so every role this repo actually needs is enumerated here, not just the
# one being added.
roles:
  builder:
    - push
  reviewer:
    - git-host-api
    - review-post
    - stage-body
  merger:
    - merge
    - push
    - release-dispatch
    - release-detect
  lead:
    - git-host-api
  # security's job is the same shape as reviewer's -- read one PR diff and
  # post a single verdict comment (BOBBIE's pre-merge security-audit gate)
  # -- so it gets the same verb set as reviewer: read access to the PR
  # (git-host-api), post the verdict (review-post), and stage that verdict's
  # body the same way every other role-with-a-body-comment does
  # (stage-body). security never merges, never pushes code, and never runs
  # a wait/poll primitive.
  security:
    - git-host-api
    - review-post
    - stage-body
merge:
  merge_requirements:
    ci_pass: false
  # required_reviewer_roles lives in the tracked gate.yaml (lr-d3969e): the
  # gate is read from the PR base commit, not from this deployment file.
  # One generic step and no host value: the repo says to converge the host
  # and the host says how (the values file at update's default path, which
  # the deployment-config repo installs; see docs/UPDATE.md). The runner
  # execs this with shell=False and inherits PATH, so the installed binary
  # resolves by name.
  post_merge_steps:
    - cmd: "clagentic-directory update"
      description: "Converge this host from its deployment values file"
      on_failure: fail
