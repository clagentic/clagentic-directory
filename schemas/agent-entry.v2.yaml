$id: https://clagentic.ai/schemas/agent-entry/v2.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: AgentEntry
description: |
  Agent capability entry for the clagentic-directory registry, schema version 2.
  v2 makes returns required. Intents, conversation_kinds, trust_labels and returns.format
  are plain strings here; they are validated at load time against the deployment's own
  vocabulary file (--registry-git-vocab or --vocab-file), which is the authority.
  See docs/VOCABULARY.md for the semantics of the starter vocabulary.

type: object
additionalProperties: false
required:
  - schema_version
  - identity
  - capabilities
properties:
  schema_version:
    const: 2
  identity:
    type: object
    required: [name, version]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      description:
        type: string
      role:
        type: string
        description: |
          Optional coarse capability role. Used as a FindByCapability fallback
          match (via /v1/find?intent=<role>) when no intent matches directly
          or via the canonical synonym table. Absent means no role fallback
          applies to this agent.
        enum:
          - builder
          - reviewer
          - merger
          - researcher
          - ops
          - diagnostician
  capabilities:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, name, description, returns]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        triggers:
          type: object
          additionalProperties: false
          properties:
            intents:
              type: array
              items:
                type: string
                description: Intent token. Validated at load time against the deployment's vocabulary file.
            conversation_kinds:
              type: array
              items:
                type: string
                description: Conversation kind token. Validated at load time against the deployment's vocabulary file.
            after_roles:
              type: array
              items:
                type: string
            after_agents:
              type: array
              items:
                type: string
        returns:
          type: object
          additionalProperties: false
          required: [verdict_field, format]
          properties:
            verdict_field:
              type: string
            format:
              type: string
              description: Return format token. Validated at load time against the deployment's vocabulary file.
  trust_labels:
    type: array
    items:
      type: string
      description: Trust label token. Validated at load time against the deployment's vocabulary file.
