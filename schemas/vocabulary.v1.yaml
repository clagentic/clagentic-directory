$id: https://clagentic.ai/schemas/vocabulary/v1.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Vocabulary
description: |
  Shape of a deployment vocabulary file for clagentic-directory.
  The authority for which tokens are valid is the deployment's own vocabulary file
  (the file passed with --registry-git-vocab or --vocab-file), kept in the deployment's
  own config repo. This schema describes only that file's structure and lists no tokens.
  examples/vocabulary.v1.yaml is a starter a deployment copies once and then owns.
  See docs/VOCABULARY.md for the semantics of the starter file's tokens.

type: object
additionalProperties: true
properties:
  intents:
    type: object
    description: Map of intent name to description.
    additionalProperties:
      type: string
  conversation_kinds:
    type: object
    description: Map of conversation kind to description.
    additionalProperties:
      type: string
  trust_labels:
    type: object
    description: Map of trust label to description.
    additionalProperties:
      type: string
  formats:
    type: object
    description: Map of return format hint to description.
    additionalProperties:
      type: string
